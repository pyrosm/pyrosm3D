<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>@@TITLE@@</title>
<style>
  :root { color-scheme: light; --ground: #eef0f3; --surface: #ffffff; --ink: #1b2129;
    --muted: #5a6470; --line: #d5dae1; --alert: #9c1c1c; --alert-ground: #fdecec;
    --text: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --left: max(16px, env(safe-area-inset-left, 0px));
    --right: max(16px, env(safe-area-inset-right, 0px)); }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; background: var(--ground); color: var(--ink);
    font: 15px/1.45 var(--text); }
  #stage { position: fixed; inset: 0; background: var(--ground); }
  #canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .panel { position: fixed; box-sizing: border-box; background: var(--surface);
    border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 2px 10px rgba(27, 33, 41, 0.14); }
  #head { top: calc(10px + env(safe-area-inset-top, 0px)); left: var(--left);
    max-width: min(23rem, calc(100% - var(--left) - var(--right))); padding: 8px 12px; }
  h1 { margin: 0; font: 600 1.05rem/1.25 var(--text); }
  summary { cursor: pointer; color: var(--muted); font-size: 0.85rem; padding: 4px 0; }
  ul { margin: 4px 0 2px; padding-left: 1.1rem; font-size: 0.85rem; }
  li { margin-bottom: 3px; }
  #bottom { position: fixed; left: var(--left); right: var(--right);
    bottom: calc(10px + env(safe-area-inset-bottom, 0px)); max-width: 30rem;
    margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
  #bottom .panel { position: static; padding: 8px 12px; }
  .panel { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #info { font-size: 0.85rem; white-space: pre-line; overflow-wrap: anywhere; }
  #error { top: calc(10px + env(safe-area-inset-top, 0px)); left: var(--left);
    right: var(--right); padding: 10px 12px; color: var(--alert);
    background: var(--alert-ground); border-color: var(--alert); z-index: 5; }
</style>
</head>
<body>
<div id="stage"><canvas id="canvas"></canvas></div>
<div id="error" class="panel" hidden></div>
<div id="head" class="panel">
  <h1>@@TITLE@@</h1>
  <details>
    <summary>What this is and how to move</summary>
    <ul>
      <li>@@ABOUT@@</li>
      <li>Tap a line or a building to read what it is.</li>
    </ul>
  </details>
</div>
<div id="bottom">
<div id="info" class="panel" hidden></div>
</div>
<script id="data" type="application/json">@@DATA@@</script>
<script src="@@DECK_GL@@"></script>
<script>
@@SCRIPT@@
</script>
</body>
</html>
