<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<style>
  :root { --ground: #f3f4f6; --surface: #fff; --ink: #1c2229; --muted: #5c6672;
    --line: #d6dbe1; --line-soft: #e7eaee; --link: #1d5fa8; }
  html, body { height: 100%; margin: 0; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { display: flex; flex-direction: column; font: 14px/1.4 system-ui, sans-serif;
    color: var(--ink); background: var(--ground); }
  header, footer { padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
    padding-block: 8px; background: var(--surface); border-bottom: 1px solid var(--line); }
  h1 { font-size: 16px; margin: 0; }
  nav { display: flex; flex-wrap: wrap; gap: 4px; }
  nav button { flex: none; min-width: 38px; padding: 3px 8px; line-height: 1.15; }
  nav small { display: block; font-size: 10px; color: var(--muted); }
  nav button[aria-pressed="true"] small { color: inherit; }
  button { font: inherit; padding: 4px 10px; border: 1px solid var(--line);
    border-radius: 4px; background: var(--surface); color: inherit; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink);
    color: var(--surface); }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--link);
    outline-offset: 2px; }
  a { color: var(--link); }
  main { position: relative; flex: 1; display: flex; min-height: 0; }
  main > div { position: relative; z-index: 0; flex: 1; min-width: 0;
    background: var(--surface); touch-action: none; }
  #tags { order: 1; box-sizing: border-box; width: 300px; overflow: auto;
    padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px 16px;
    background: var(--surface); border-left: 1px solid var(--line); }
  #tags p { margin: 0; }
  #tags > button { float: right; margin: 0 0 4px 8px; }
  #tags h2 { font-size: 15px; margin: 0 0 2px; }
  #tags table { border-collapse: collapse; margin-top: 10px; width: 100%; }
  #tags th, #tags td { text-align: left; vertical-align: top; padding: 3px 8px 3px 0;
    border-top: 1px solid var(--line-soft); overflow-wrap: anywhere; }
  #tags th { font-weight: 600; white-space: nowrap; }
  footer { padding-block: 4px; font-size: 12px; color: var(--muted); }
  /* A small page, such as a phone's: the level buttons are one row under the title
     that scrolls sideways, and the panel lies over the view, along its lower edge
     when the page is narrow and in its right corner when the page is low */
  @media (max-width: 700px), (max-height: 500px) {
    nav { order: 1; flex: 1 1 100%; flex-wrap: nowrap; overflow-x: auto; }
    #tags { position: absolute; z-index: 1; right: 0; bottom: 0; left: 0; width: auto;
      max-height: 45%; padding-left: max(16px, env(safe-area-inset-left, 0px));
      border-left: 0; border-top: 1px solid var(--line); }
  }
  @media (max-height: 500px) and (min-width: 701px) {
    #tags { left: auto; width: min(300px, 45%); max-height: 100%; padding-left: 16px;
      border-left: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>$title</h1>
  <nav id="levels" aria-label="Levels"></nav>
  <button type="button" id="legend" aria-pressed="true">Legend</button>
</header>
<script type="application/json" id="page-data">$data</script>
<main>
  <aside id="tags"><p>Click an area, a line, a marker or a column to see what it is and its OpenStreetMap tags.</p></aside>
  $plot
</main>
<footer>Map data © OpenStreetMap contributors</footer>
</body>
</html>
