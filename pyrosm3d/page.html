<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; font: 14px/1.4 system-ui, sans-serif;
    color: #1c2229; background: #f3f4f6; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
    padding: 8px 16px; background: #fff; border-bottom: 1px solid #d6dbe1; }
  h1 { font-size: 16px; margin: 0; }
  nav { display: flex; flex-wrap: wrap; gap: 4px; }
  button { font: inherit; padding: 4px 10px; border: 1px solid #d6dbe1; border-radius: 4px;
    background: #fff; color: inherit; cursor: pointer; }
  button[aria-pressed="true"] { background: #1c2229; border-color: #1c2229; color: #fff; }
  main { flex: 1; display: flex; min-height: 0; }
  main > div { flex: 1; min-width: 0; background: #fff; }
  #tags { order: 1; width: 300px; overflow: auto; padding: 12px 16px; background: #fff;
    border-left: 1px solid #d6dbe1; }
  #tags h2 { font-size: 15px; margin: 0 0 2px; }
  #tags table { border-collapse: collapse; margin-top: 10px; width: 100%; }
  #tags th, #tags td { text-align: left; vertical-align: top; padding: 3px 8px 3px 0;
    border-top: 1px solid #e7eaee; overflow-wrap: anywhere; }
  #tags th { font-weight: 600; white-space: nowrap; }
  footer { padding: 4px 16px; font-size: 12px; color: #5c6672; }
  @media (max-width: 700px) {
    main { flex-direction: column; }
    #tags { width: auto; max-height: 35%; border-left: 0; border-top: 1px solid #d6dbe1; }
  }
</style>
</head>
<body>
<header>
  <h1>$title</h1>
  <nav id="levels" aria-label="Levels"></nav>
</header>
<script type="application/json" id="page-data">$data</script>
<main>
  <aside id="tags"><p>Click an area, a line or a marker to see its OpenStreetMap tags.</p></aside>
  $plot
</main>
<footer>Map data © OpenStreetMap contributors</footer>
</body>
</html>
